[workspace]
members = [
    "core",
    "server",
    "client", 
    "hsql", 
    "tests",
]
resolver = "2"

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
tokio = { version = "1", features = ["full"] }
rustyline = "18"
comfy-table = "7"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crc32fast = "1"
